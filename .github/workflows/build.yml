# Controls when the workflow will run
on:
  # Allows you to run this workflow manually target the Actions tab
  workflow_dispatch:

name: Build
jobs:
  build:
    name: Build ${{matrix.name}}-${{matrix.runson}}_${{ matrix.env }}${{ matrix.required && '' || ' (optional)' }}
    # `required` doesn't gate whether the job RUNS - every matrix entry
    # always runs - it only gates whether a failure actually fails the
    # workflow (continue-on-error below). Modeled directly on the sibling
    # Tinyjoypad_SDL project's own build.yml matrix (same runson/sys/env/
    # SDL shape, same per-runsontype step structure), which has no
    # `required` field of its own - added here on direct request: one
    # canonical, most-representative combo per OS family (plus the one
    # real Playdate device build) is required to pass; every other
    # variant (32-bit, older OS releases, ARM runners, the extra macOS
    # version/arch spread) is real coverage worth keeping but not worth
    # blocking on, since they're all building the exact same source
    # against a different compiler/libc/arch, not exercising different
    # code paths.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runson: 'windows-latest',   runsontype: 'windows', sys: 'mingw64', env: 'x86_64', name: 'GamebuinoClassicSDL2', binsuffix: '.exe', SDL: 'sdl2', required: true }
          - { runson: 'windows-latest',   runsontype: 'windows', sys: 'mingw32', env: 'i686',   name: 'GamebuinoClassicSDL2', binsuffix: '.exe', SDL: 'sdl2', required: false }
          - { runson: 'ubuntu-24.04',     runsontype: 'linux',   sys: 'usr',     env: 'x64',    name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: true }
          - { runson: 'ubuntu-22.04',     runsontype: 'linux',   sys: 'usr',     env: 'x64',    name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'ubuntu-24.04-arm', runsontype: 'linux',   sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'ubuntu-22.04-arm', runsontype: 'linux',   sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'macos-14',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: true }
          - { runson: 'macos-15',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'macos-26',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'macos-15-intel',   runsontype: 'mac',     sys: 'usr',     env: 'x86_64', name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'macos-26-intel',   runsontype: 'mac',     sys: 'usr',     env: 'x86_64', name: 'GamebuinoClassicSDL2', binsuffix: '',     SDL: 'sdl2', required: false }
          - { runson: 'windows-latest',   runsontype: 'windows', sys: 'mingw64', env: 'x86_64', name: 'GamebuinoClassicSDL3', binsuffix: '.exe', SDL: 'sdl3', required: true }
          - { runson: 'windows-latest',   runsontype: 'windows', sys: 'mingw32', env: 'i686',   name: 'GamebuinoClassicSDL3', binsuffix: '.exe', SDL: 'sdl3', required: false }
          - { runson: 'ubuntu-24.04',     runsontype: 'linux',   sys: 'usr',     env: 'x64',    name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: true }
          - { runson: 'ubuntu-22.04',     runsontype: 'linux',   sys: 'usr',     env: 'x64',    name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'ubuntu-24.04-arm', runsontype: 'linux',   sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'ubuntu-22.04-arm', runsontype: 'linux',   sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'macos-14',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: true }
          - { runson: 'macos-15',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'macos-26',         runsontype: 'mac',     sys: 'usr',     env: 'arm64',  name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'macos-15-intel',   runsontype: 'mac',     sys: 'usr',     env: 'x86_64', name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'macos-26-intel',   runsontype: 'mac',     sys: 'usr',     env: 'x86_64', name: 'GamebuinoClassicSDL3', binsuffix: '',     SDL: 'sdl3', required: false }
          - { runson: 'ubuntu-24.04',     runsontype: 'playdate',sys: 'usr',     env: 'device', name: 'GamebuinoClassicPlaydate', binsuffix: '.pdx', SDL: 'playdate', required: true }

    runs-on: ${{matrix.runson}}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Playdate doesn't touch either vendored SDL2/SDL3 checkout at all
          # (src/playdate/CMakeLists.txt never references them) - skipping
          # submodules there avoids cloning two full SDL checkouts for
          # nothing.
          submodules: ${{ matrix.runsontype != 'playdate' }}

      - if: ${{ matrix.runsontype == 'windows'}}
        name: Setup Msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          install: >-
            base-devel
            mingw-w64-${{matrix.env}}-gcc
            mingw-w64-${{matrix.env}}-make
            mingw-w64-${{matrix.env}}-cmake
            mingw-w64-${{matrix.env}}-ninja

      - if: ${{ matrix.runsontype == 'linux' }}
        name: install libsdl 2/3 dependencies
        run: |
          sudo apt update
          sudo apt-get install -y build-essential cmake git wget patchelf libxtst-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libsndio-dev libasound2-dev libdbus-1-dev libibus-1.0-dev libjack-dev libdrm-dev libudev-dev libgl1-mesa-dev libgles2-mesa-dev libsndio-dev libwayland-dev libxkbcommon-dev wayland-protocols qtbase5-dev libpulse-dev libsamplerate0-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libdrm-dev libgbm-dev libwayland-dev libxkbcommon-dev
          #try these 1 by 1 as they are different on different ubuntu versions
          for i in libsndio7.0 libsndio7.1 libsndio7.2 libsndio-dev libasound2-dev libdecor-0-dev libdecoration0-dev libpipewire-0.3-dev libpipewire-dev liburing-dev; do sudo apt-get install -y $i || true; done

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Install Playdate build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake gcc-arm-none-eabi

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Grab Playdate SDK
        uses: wei/wget@v1
        with:
          args: -O PlaydateSDK-latest.tar.gz https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Extract Playdate SDK
        run: |
          tar -xvf PlaydateSDK-latest.tar.gz
          rm -f PlaydateSDK-latest.tar.gz
          mv PlaydateSDK-* PlaydateSDK

      - if: ${{ matrix.runsontype == 'windows'}}
        name: Build Game Windows
        shell: msys2 {0}
        run: |
          cd src/${{matrix.SDL}}
          mkdir build
          cd build
          cmake -G "Ninja" -DUSE_VENDORED_SDL=1 ..
          ninja

      - if: ${{ matrix.runsontype != 'windows' && matrix.runsontype != 'playdate'}}
        name: Build Game Other
        run: |
          cd src/${{matrix.SDL}}
          mkdir build
          cd build
          cmake -DUSE_VENDORED_SDL=1 ..
          make

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Build Game Playdate
        run: |
          export PLAYDATE_SDK_PATH="$PWD/PlaydateSDK"
          echo SDK Path: $PLAYDATE_SDK_PATH
          cd src/playdate
          mkdir build_device
          cd build_device
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$PLAYDATE_SDK_PATH/C_API/buildsupport/arm.cmake ..
          make

      - if: ${{ matrix.runsontype == 'mac'}}
        name: Copy Game And Assets Mac
        run: |
          mkdir ./Release
          mkdir "./Release/${{matrix.name}}.app"
          mkdir "./Release/${{matrix.name}}.app/Contents"
          mkdir "./Release/${{matrix.name}}.app/Contents/MacOS"
          mkdir "./Release/${{matrix.name}}.app/Contents/Resources"
          cp "src/${{matrix.SDL}}/build/${{matrix.name}}" "./Release/${{matrix.name}}.app/Contents/MacOS/${{matrix.name}}"
          cp ./README.md "./Release/"
          cp ./LICENSE.txt "./Release/"

          #for PNG
          mkdir icon.iconset
          sips -z 16 16 "./metadata/icon.png" --out icon.iconset/icon_16x16.png
          sips -z 32 32 "./metadata/icon.png" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 "./metadata/icon.png" --out icon.iconset/icon_32x32.png
          sips -z 64 64 "./metadata/icon.png" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 "./metadata/icon.png" --out icon.iconset/icon_128x128.png
          sips -z 256 256 "./metadata/icon.png" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 "./metadata/icon.png" --out icon.iconset/icon_256x256.png
          sips -z 512 512 "./metadata/icon.png" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 "./metadata/icon.png" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "./metadata/icon.png" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o ./icon.icns
          mv ./icon.icns "./Release/${{matrix.name}}.app/Contents/Resources/icon.icns"

          #create PList
          echo "<?xml version='1.0' encoding='UTF-8'?>" > "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "<!DOCTYPE plist PUBLIC '-//Apple Computer//DTD PLIST 1.0//EN' 'http://www.apple.com/DTDs/PropertyList-1.0.dtd'>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "<plist version='1.0'>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "  <dict>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleExecutable</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>${{matrix.name}}</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleIdentifier</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>com.github.joyrider3774.${{matrix.name}}</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleName</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>Gamebuino Classic For SDL</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleIconFile</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>icon.icns</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleShortVersionString</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>0.01</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundleInfoDictionaryVersion</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>6.0</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>CFBundlePackageType</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <string>APPL</string>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>IFMajorVersion</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <integer>0</integer>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <key>IFMinorVersion</key>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "    <integer>1</integer>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "  </dict>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"
          echo "</plist>" >> "./Release/${{matrix.name}}.app/Contents/Info.plist"

          cp -r "metadata/gbu" "./Release/"
          cp -r "metadata/screenshots" "./Release/"

      - if: ${{ matrix.runsontype == 'mac'}}
        name: Ad Hoc Code sign Appl Bundle (Mac)
        run: |
          codesign --force --deep -s - "./Release/${{matrix.name}}.app"

      - if: ${{ matrix.runsontype != 'mac' && matrix.runsontype != 'playdate'}}
        name: Copy Game And Assets Other
        run: |
          mkdir ./Release
          mkdir "./Release/${{matrix.name}}"
          cp "src/${{matrix.SDL}}/build/${{matrix.name}}${{matrix.binsuffix}}" "./Release/${{matrix.name}}/"
          cp ./README.md "./Release/${{matrix.name}}/"
          cp ./LICENSE.txt "./Release/${{matrix.name}}/"

      - if: ${{ matrix.runsontype != 'mac' && matrix.runsontype != 'playdate'}}
        run: |
          cp -r "metadata/gbu" "./Release/${{matrix.name}}/"
          cp -r "metadata/screenshots" "./Release/${{matrix.name}}/"

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Copy Game And Assets Playdate
        # No -g/.gbu/-ms CLI on this port at all (see CLAUDE.md's "The
        # Playdate port" section's own scope list), so metadata/gbu and
        # metadata/screenshots (both CLI-launch-related) don't apply here
        # the way they do for the SDL ports above. No per-matrix-name
        # subfolder either (unlike "Copy Game And Assets Other" below) -
        # the .pdx itself is meant to sit at the artifact's own root
        # level, ready to sideload/drag onto the Simulator directly.
        run: |
          mkdir ./Release
          # .pdx is a directory bundle (like a macOS .app), not a single
          # file - cp needs -r or this silently fails to copy anything.
          cp -r "src/playdate/build_device/GamebuinoClassic_DEVICE.pdx" "./Release/GamebuinoClassic.pdx"
          cp ./README.md "./Release/"
          cp ./LICENSE.txt "./Release/"

      - if: ${{ matrix.runsontype != 'playdate'}}
        name: Store build
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.name}}-${{matrix.runson}}_${{ matrix.env }}
          path: ./Release/

      - if: ${{ matrix.runsontype == 'playdate' }}
        name: Store build (playdate)
        uses: actions/upload-artifact@v7
        with:
          name: Gamebuino Classic Playdate
          path: ./Release/
